<!-- SEARCH OVERLAY MODAL -->
<div id="search-overlay"
    class="fixed inset-0 z-[300] bg-slate-950/95 backdrop-blur-xl flex flex-col items-center justify-start pt-32 opacity-0 pointer-events-none transition-all duration-300">
    <button id="search-close"
        class="absolute top-6 right-6 w-12 h-12 flex items-center justify-center rounded-full bg-white/10 text-white hover:bg-white/20 transition-all">
        <i data-lucide="x" class="w-6 h-6"></i>
    </button>
    <div class="w-full max-w-2xl px-6">
        <div class="relative">
            <i data-lucide="search" class="absolute left-6 top-1/2 -translate-y-1/2 w-6 h-6 text-slate-400"></i>
            <input type="text" id="search-input"
                class="w-full bg-white/10 border border-white/20 rounded-full px-16 py-5 text-xl text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-[#224fc6]/50 backdrop-blur-sm"
                placeholder="Search this page..." autocomplete="off">
        </div>
        <p class="text-slate-500 text-sm mt-4 text-center">Press <kbd
                class="px-2 py-1 bg-white/10 rounded text-white">Enter</kbd> to find, <kbd
                class="px-2 py-1 bg-white/10 rounded text-white">Esc</kbd> to close</p>
    </div>
</div>
